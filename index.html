<!DOCTYPE html>
<html>
<head>
    <title>AR Nav Fix</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <button id="permission-btn" style="position: absolute; z-index: 999; top: 20px; left: 20px; padding: 15px;">
        Enable Sensors & Start
    </button>

    <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-entity id="arrow" 
                  gps-entity-place="latitude: 1.346709; longitude: 103.964710;" 
                  position="0 0 0">
            <a-cone color="red" radius-bottom="2" height="5" rotation="90 0 0"></a-cone>
        </a-entity>

        <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
        const btn = document.getElementById('permission-btn');
        btn.addEventListener('click', function() {
            // Request iOS Orientation Permission
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response == 'granted') {
                            btn.style.display = 'none'; // Hide button once granted
                        }
                    })
                    .catch(console.error);
            } else {
                // Non-iOS device
                btn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
